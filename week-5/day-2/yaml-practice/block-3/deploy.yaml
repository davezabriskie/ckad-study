apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sizer
  name: sizer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sizer
  strategy: {}
  template:
    metadata:
      labels:
        app: sizer
    spec:
      containers:
      - image: nginx:1.21
        name: nginx
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
